<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>20 cm · 22秒卡点续跑</title>
<style>
:root{color-scheme:dark;--bg:#10171f;--panel:#18232e;--line:#364958;--ink:#eaf1f6;--muted:#a7b8c6;--blue:#78c4ff;--red:#ff9b94;--green:#8ddab3;--amber:#f2cc83}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}a{color:var(--blue)}header,main{padding:22px 28px;max-width:1500px;margin:auto}header{border-bottom:1px solid var(--line)}h1{font-size:28px;margin:12px 0 4px}h2{font-size:18px;margin:0 0 10px}.muted{color:var(--muted)}.notice,.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:18px}.notice{border-left:3px solid var(--amber)}.stats{display:flex;gap:28px;flex-wrap:wrap;margin:20px 0}.stats strong{font-size:25px;display:block}.flex{display:flex;gap:10px;align-items:center;flex-wrap:wrap}button,select{font:inherit;color:var(--ink);background:#233544;border:1px solid #526a7c;border-radius:5px;padding:7px 10px;cursor:pointer}button:hover,button.selected{border-color:var(--blue);background:#26455d}.bad{color:var(--red)}.good{color:var(--green)}.tablewrap{overflow-x:auto}table{border-collapse:collapse;width:100%}th,td{border-bottom:1px solid var(--line);padding:8px;text-align:left;white-space:nowrap}.cell{width:100%;text-align:left;font-size:12px;min-width:135px}.grid{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(320px,1fr);gap:18px}video{width:100%;background:black;aspect-ratio:8/3}canvas{display:block;width:100%;height:260px;background:#101922;cursor:crosshair}.metric{font-variant-numeric:tabular-nums}pre{max-height:280px;overflow:auto;font-size:11px;white-space:pre-wrap}.legend{font-size:12px}.blue{color:#78c4ff}.purple{color:#c2a5ff}.events{max-height:150px;overflow:auto}.events button{font-size:12px;margin:3px}.small{font-size:12px}@media(max-width:950px){.grid{grid-template-columns:1fr}header,main{padding:15px}.cell{min-width:120px}}
</style></head><body>
<header><nav><a href="/recovery20amp20">查看 ±20° 新批次 →</a> · <a href="/overspeed20">← 关节超速诊断与父轨迹</a> · <a href="/speed20">高轮速试验</a> · <a href="/experiments">历史实验</a></nav><h1>20 cm · 22秒卡点续跑</h1><p class="muted">A03_C03 前情 · 45° · 上行15级 · 轮组 3→6 rad/s · 左右摇臂 ±10°</p></header>
<main><div class="notice">所有分支从同一物理步长下的 A03_C03 在 <b>22秒</b>的状态开始。22～25秒渐增轮速，每条最多运行至52秒。完整上楼、平台、下楼与停稳尚未评估；本批记录均不入成功数据集。</div>
<div id="stats" class="stats"></div><section class="panel"><div class="flex"><h2>全部条件对照</h2><label>物理步长 <select id="dt"><option value="0.001">1 ms · 主批</option><option value="0.0005">0.5 ms · 如有复核</option><option value="0.00025">0.25 ms · 如有复核</option></select></label><button id="refresh">刷新结果</button></div><p class="muted small">F/M/R：前/中/后轮组，每组含左右两轮。中立摇臂列为仅轮组加速；第一行为保持及仅摇臂对照。单元格显示阶段结果和过程违规。</p><div id="status"></div><div class="tablewrap" id="matrix"></div></section>
<section class="panel" id="detail"><p class="muted">选择一个条件查看完整诊断。</p></section></main>
<script>
const $=id=>document.getElementById(id),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),fmt=(x,n=3)=>Number.isFinite(x)?x.toFixed(n):'—';
const wheelNames={H:'保持3 · 对照',F:'仅前轮组',M:'仅中轮组',R:'仅后轮组',FM:'前＋中',FR:'前＋后',MR:'中＋后',FMR:'前＋中＋后'},rockerNames={N:'中立目标',SP:'同向 · 先正',SN:'同向 · 先负',DP:'反向 · 左先正',DN:'反向 · 右先正'};
const jointName=n=>n.replace('left_','左').replace('right_','右').replace('front_','前').replace('middle_','中').replace('rear_','后').replace('rocker_joint','摇臂').replace('steer_joint','转向').replace('wheel_joint','轮轴');
const reasons={'continuation_time_limit_30s':'续跑30秒到时限','physics_or_route_violation':'其他过程条件触发终止','joint_limit_error_over_1deg':'关节角度限位误差超过1°','contact_penetration_over_20mm':'接触穿透超过20 mm','route_steer_over_30deg':'转向超过30°','route_roll_over_15deg':'横滚超过15°','route_pitch_over_60deg':'俯仰超过60°','ascent_platform_support_observed':'六轮建立平台支撑'};
let payload=null,selected=null,curve=null,requestId=0;
function outcome(r){return r.ascent_platform_support?'已登顶':r.rear_highest_100ms_geometry_level?`后轮越过${r.rear_highest_100ms_geometry_level}级`:'未持续越过首阶'}
function drawMatrix(){const dt=Number($('dt').value);$('matrix').innerHTML=`<table><thead><tr><th>加速轮组</th>${Object.values(rockerNames).map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${Object.entries(wheelNames).map(([w,label])=>`<tr><th>${label}</th>${Object.keys(rockerNames).map(k=>{const r=payload.cases.find(x=>x.parameters.wheel===w&&x.parameters.rocker===k&&x.physics_step_s===dt);return `<td>${r?`<button class="cell ${r.id===selected?.id?'selected':''}" data-id="${r.id}">${outcome(r)}<br><span class="${r.process_valid?'muted':'bad'}">${r.process_valid?'无过程违规':'有过程违规'}</span> · ${r.video_url?'视频就绪':'视频生成中'}</button>`:'<span class="muted">未运行</span>'}</td>`}).join('')}</tr>`).join('')}</tbody></table>`;document.querySelectorAll('[data-id]').forEach(x=>x.onclick=()=>show(x.dataset.id));}
async function load(){try{const response=await fetch('/api/recovery20',{cache:'no-store'});if(!response.ok)throw Error(`HTTP ${response.status}`);payload=await response.json();let primary=payload.cases.filter(x=>x.physics_step_s===.001);$('stats').innerHTML=`<div><strong>${primary.length} / 40</strong>主批条件完成</div><div><strong>${payload.cases.filter(x=>x.video_url).length}</strong>视频就绪</div><div><strong>${primary.filter(x=>x.true_both_rear_crossing).length}</strong>双后轮持续越首阶</div><div><strong>${primary.filter(x=>!x.process_valid).length}</strong>有过程违规</div><div><strong>未评估</strong>完整路线成功率</div>`;$('status').innerHTML=`<p class="muted">恢复检查：${payload.gate?.passed?'通过，已核对22～52秒保持动作':'等待完成'}。${payload.completion?'本批已停止。':'实验或媒体处理进行中。'} ${payload.verification?.passed?'数据和媒体核验已通过。':''}</p>`;drawMatrix();const wanted=new URLSearchParams(location.search).get('case');if(!selected&&payload.cases.length)await show(payload.cases.some(x=>x.id===wanted)?wanted:payload.cases.find(x=>x.parameters.wheel==='FMR'&&x.parameters.rocker==='N')?.id||payload.cases[0].id);else if(selected)await show(selected.id);}catch(e){$('status').textContent='读取失败：'+e.message}}
async function show(id){const token=++requestId;selected=payload.cases.find(x=>x.id===id);curve=null;if(!selected)return;let r=selected;$('dt').value=String(r.physics_step_s);drawMatrix();history.replaceState(null,'',`?case=${encodeURIComponent(id)}`);let v=Object.entries(r.overspeed).filter(([n,x])=>x.audit.event_count);let p=r.parameters;const target=[3,3,3];if(p.wheel!=='H')for(let [i,l] of ['F','M','R'].entries())if(p.wheel.includes(l))target[i]=6;
$('detail').innerHTML=`<h2>${esc(id)}</h2><p>${wheelNames[p.wheel]} · ${rockerNames[p.rocker]} · 物理步长 ${fmt(r.physics_step_s*1000,2)} ms · 25秒后前/中/后基准目标 ${target.join(' / ')} rad/s</p><div class="grid"><div>${r.video_url?`<video id="video" controls preload="metadata" src="${r.video_url}"></video>`:'<p class="muted">视频生成中，请稍后刷新。</p>'}<div class="flex"><button id="intervene">跳到22秒介入点</button><span id="clock" class="metric muted">视频从仿真17秒开始</span></div><p class="small muted">前5秒为原父轨迹，之后为本候选实际记录。原 URDF 视觉网格；末帧表示记录结束。</p><p><a href="${r.parent_url}" target="_blank">查看完整父轨迹</a> · <a href="${r.result_url}">结果JSON</a> · <a href="${r.trajectory_url}">续跑原始NPZ</a></p></div><div><p><b>${outcome(r)}</b> · ${r.process_valid?'未检测到过程违规':'存在过程违规'} · 不入库</p><p>结束原因：${esc(reasons[r.termination_reason]||r.termination_reason)}<br><code>${esc(r.termination_reason)}</code></p><p>${r.diagnostic_stop_reasons.map(x=>`${esc(reasons[x]||x)} <code>${esc(x)}</code>`).join('<br>')}</p><p>续跑 ${fmt(r.continuation_duration_s)} 秒，终止于 ${fmt(r.actual_duration_s)} 秒。<br>车身最大前进 ${fmt(r.max_base_x_progress_m*1000,2)} mm，最终净位移 ${fmt(r.net_base_x_m*1000,2)} mm。</p><p class="${v.length?'bad':'muted'}">速度违规：${v.length?v.map(([n])=>jointName(n)).join('、'):'无'}。</p><p class="small muted">局部前进距离只用于诊断，不代表越阶。速度违规不会单独中止诊断，原验收要求仍保留。</p></div></div><hr><h2>实际动作与接触</h2><div class="flex"><label>关节 <select id="joint">${Object.keys(r.audit.joint_velocity_limit_rad_s).map(n=>`<option value="${n}" ${n==='left_rear_wheel_joint'?'selected':''}>${jointName(n)}</option>`).join('')}</select></label><label>指标 <select id="signal"><option value="speed">角速度 rad/s</option><option value="angle">角度 °</option><option value="torque">执行器力矩 N·m</option><option value="contact">该轮接触法向力 N</option><option value="body">车身前进距离 m</option><option value="pose">车身横滚 / 俯仰 °</option></select></label><label>窗口 <select id="window"><option value="all">整个续跑</option><option value="ramp">22～26秒</option><option value="event">首次超速前后1秒</option><option value="tail">最后6秒</option></select></label></div><p class="legend"><span class="blue">蓝：实际值 / 横滚</span> · <span class="purple">紫：目标值 / 俯仰</span> · 黄色：限值（落在当前纵轴范围内时显示）。点击曲线可跳转视频。</p><canvas id="chart" width="1100" height="260"></canvas><p id="hover" class="small muted">曲线读取中…</p><p id="jointStats" class="small muted"></p><div id="events" class="events"></div><details><summary>父状态、参数与原始审核</summary><pre>${esc(JSON.stringify({parent_id:r.parent_id,parent_step:r.parent_step,checkpoint_id:r.checkpoint_id,parameters:r.parameters,audit:r.audit,route:r.route},null,2))}</pre></details>`;
const video=$('video');if(video)video.ontimeupdate=()=>{$('clock').textContent=`仿真 ${fmt(video.currentTime+r.video_info.first_time_s)} s · 介入后 ${fmt(video.currentTime+r.video_info.first_time_s-22)} s`};$('intervene').onclick=()=>seek(22);for(let x of ['joint','signal','window'])$(x).onchange=draw;
if(r.curves_url){try{const response=await fetch(r.curves_url);const next=await response.json();if(token!==requestId)return;curve=next;draw()}catch(e){if(token===requestId)$('hover').textContent='曲线读取失败：'+e.message}}else $('hover').textContent='曲线生成中。';}
function seek(t){const v=$('video');if(v){v.currentTime=Math.max(0,t-selected.video_info.first_time_s);v.play().catch(()=>{})}}
function draw(){if(!curve)return;let joint=$('joint').value,j=curve.joints[joint],signal=$('signal').value,events=selected.overspeed[joint].audit.events,w=$('window').value,start=22,end=selected.actual_duration_s;if(w==='ramp')end=Math.min(end,26);if(w==='tail')start=Math.max(22,end-6);if(w==='event'){let t=events[0]?.first_s??22;start=Math.max(22,t-1);end=Math.min(end,t+1)}let rows=(signal==='body'||signal==='pose'?curve.body.rows:j.rows).filter(r=>r[0]>=start&&r[0]<=end);let first=signal==='speed'?1:signal==='angle'?4:signal==='torque'?3:signal==='contact'?6:signal==='body'?1:2,second=signal==='speed'?2:signal==='angle'?5:signal==='pose'?3:null;const canvas=$('chart'),ctx=canvas.getContext('2d'),L=65,R=20,T=14,B=29,W=canvas.width,H=canvas.height;ctx.clearRect(0,0,W,H);if(!rows.length)return;let values=rows.flatMap(r=>[r[first],second===null?null:r[second]]).filter(Number.isFinite),lo=Math.min(0,...values),hi=Math.max(0,...values),pad=Math.max((hi-lo)*.12,.001);lo-=pad;hi+=pad;let xx=t=>L+(t-start)/(end-start||1)*(W-L-R),yy=v=>T+(hi-v)/(hi-lo)*(H-T-B);ctx.strokeStyle='#364958';ctx.strokeRect(L,T,W-L-R,H-T-B);ctx.fillStyle='#a7b8c6';ctx.font='12px sans-serif';ctx.fillText(fmt(hi,3),3,T+8);ctx.fillText(fmt(lo,3),3,H-B);ctx.fillText(fmt(start,2)+' s',L,H-7);ctx.fillText(fmt(end,2)+' s',W-R-55,H-7);
for(let t of [22,25,46])if(t>=start&&t<=end){ctx.strokeStyle='#876e47';ctx.setLineDash([4,4]);ctx.beginPath();ctx.moveTo(xx(t),T);ctx.lineTo(xx(t),H-B);ctx.stroke()}let limit=signal==='speed'?j.speed_limit:signal==='torque'?j.torque_limit:null;if(limit!==null)for(let level of [-limit,limit])if(level>=lo&&level<=hi){ctx.strokeStyle='#f2cc83';ctx.setLineDash([6,4]);ctx.beginPath();ctx.moveTo(L,yy(level));ctx.lineTo(W-R,yy(level));ctx.stroke()}ctx.setLineDash([]);
function line(col,color){if(col===null)return;ctx.strokeStyle=color;ctx.lineWidth=1.5;ctx.beginPath();let begun=false;for(let r of rows){if(!Number.isFinite(r[col])){begun=false;continue}if(begun)ctx.lineTo(xx(r[0]),yy(r[col]));else ctx.moveTo(xx(r[0]),yy(r[col]));begun=true}ctx.stroke()}line(first,'#78c4ff');line(second,'#c2a5ff');$('jointStats').textContent=`${jointName(joint)}：实际速度峰值 ${fmt(j.max_abs_velocity_rad_s)} rad/s；URDF上限 ${fmt(j.speed_limit)} rad/s；实际力矩峰值 ${fmt(j.max_abs_torque_nm,2)} N·m；限幅附近占比 ${fmt(j.torque_saturation_fraction*100,2)}%。曲线保留每50 ms区间内的极值。`;
$('events').innerHTML=events.length?events.map((e,i)=>`<button data-event="${i}">${fmt(e.first_s)} s 超速 · 峰值 ${fmt(e.peak_signed_rad_s)} rad/s · ${fmt(e.duration_s*1000,2)} ms${e.censored?' · 未观察到恢复':''}</button>`).join(''):'<span class="muted small">此关节无超过原审核阈值的速度事件。</span>';document.querySelectorAll('[data-event]').forEach(b=>b.onclick=()=>seek(events[Number(b.dataset.event)].first_s));
function at(event){let t=start+(event.offsetX/canvas.clientWidth*W-L)/(W-L-R)*(end-start);return rows.reduce((a,b)=>Math.abs(a[0]-t)<Math.abs(b[0]-t)?a:b)}canvas.onmousemove=e=>{let r=at(e);$('hover').textContent=`仿真 ${fmt(r[0])} s · 实际 ${fmt(r[first],5)}${second!==null&&Number.isFinite(r[second])?' · 目标/俯仰 '+fmt(r[second],5):''}`};canvas.onclick=e=>seek(at(e)[0]);$('hover').textContent='移动查看读数，点击跳转视频。横轴为绝对仿真时间。';}
$('refresh').onclick=load;$('dt').onchange=drawMatrix;load();
</script></body></html>
