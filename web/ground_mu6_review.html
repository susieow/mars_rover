<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>20 cm 地面起步恒定轮速</title><style>
body{background:#10171f;color:#eaf1f6;font:15px/1.6 system-ui,sans-serif;max-width:1300px;margin:auto;padding:24px}a{color:#78c4ff}button,select{background:#263846;color:white;border:1px solid #567083;padding:8px;border-radius:5px;cursor:pointer}.panel{background:#18232e;padding:18px;border-radius:10px;margin:16px 0}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.case{min-height:76px;text-align:left}.selected{border-color:#78c4ff}video{width:100%;max-width:960px;background:black}canvas{display:block;width:100%;height:260px;background:#101922}code{color:#f2cc83}.muted{color:#afc2d0}.warning{color:#ffb1a7}@media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr)}}
</style></head><body><a href="/recovery20frictionnegative">← 前一批摩擦对照</a><h1>20 cm · 地面起步 · 台阶摩擦 6.0</h1><div class="panel">六轮从仿真开始分别请求同一档恒定基础速度（3、4、5 或 6 rad/s），保留目标变化率和方向修正。前轮首次接触台阶后，连续 2 秒车身向前净位移不足 2 cm 时，开始左右同向摆动：先 −20° 后 +20°，或先 +20° 后 −20°。触发后继续观察 30 秒；未触发最多观察 120 秒。违规仅记录，完整路线未评估。</div>
<section class="panel"><p id="status">加载中…</p><div class="grid" id="cases"></div></section><section class="panel" id="detail">选择一条轨迹。</section>
<script>
const $=id=>document.getElementById(id),fmt=(x,n=3)=>Number.isFinite(x)?x.toFixed(n):'未发生',escapeHtml=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let cases=[],current=null,curves=null;
function name(r){return `${r.parameters.wheel_base_target_rad_s} rad/s · ${r.parameters.rocker==='SN'?'先 −20°':'先 +20°'}`}
function drawButtons(){ $('cases').innerHTML=cases.map(r=>`<button class="case ${current?.id===r.id?'selected':''}" data-id="${r.id}"><b>${name(r)}</b><br>${r.video_url?'视频就绪':'视频生成中'} · ${r.true_both_rear_crossing?'曾越首阶':'未越首阶'}</button>`).join('');document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>show(b.dataset.id)); }
async function load(){try{let r=await fetch('/api/groundmu6',{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);cases=(await r.json()).cases;$('status').textContent=`已完成 ${cases.length} / 8，视频就绪 ${cases.filter(x=>x.video_url).length} / 8。`;drawButtons();let wanted=new URLSearchParams(location.search).get('case');if(!current&&cases.length)await show(cases.find(x=>x.id===wanted)?.id||cases[0].id);else if(current)await show(current.id)}catch(e){$('status').textContent='读取失败：'+e.message}}
async function show(id){current=cases.find(r=>r.id===id);if(!current)return;let r=current;curves=null;drawButtons();history.replaceState(null,'','?case='+encodeURIComponent(id));let errors=r.process_reasons.length?r.process_reasons.map(escapeHtml).join('、'):'未记录';$('detail').innerHTML=`<h2>${name(r)}</h2><p>首次接触：${fmt(r.first_contact_s)} s；卡住触发：${fmt(r.stall_trigger_s)} s；记录结束：${fmt(r.actual_duration_s)} s</p>${r.video_url?`<video controls preload="metadata" src="${r.video_url}"></video>`:'<p>视频生成中</p>'}<p><button id="jump">跳到摇臂触发</button> <a href="${r.result_url}">结果 JSON</a> · <a href="${r.trajectory_url}">轨迹数据</a></p><p>${r.true_both_rear_crossing?'双后轮曾越过首阶':'双后轮未持续越首阶'}；末段保持等级 ${r.rear_retained_geometry_level_final_1s}；${r.ascent_platform_support?'建立平台支撑':'未登顶'}。完整路线未评估，不入库。</p><p class="warning">过程记录：<code>${errors}</code>；最大穿透 ${fmt(r.audit.max_contact_penetration_m*1000,2)} mm。</p><label>关节 <select id="joint"></select></label> <label>指标 <select id="signal"><option value="speed">速度 rad/s</option><option value="angle">角度 °</option><option value="torque">力矩 N·m</option><option value="contact">轮子法向接触力 N</option></select></label><p class="muted">蓝色为实际值；紫色为目标值。时间从地面起步开始。</p><canvas id="chart" width="1100" height="260"></canvas><p id="hint">曲线读取中…</p>`;$('jump').onclick=()=>{let v=document.querySelector('video');if(v&&r.stall_trigger_s!=null){v.currentTime=r.stall_trigger_s;v.play().catch(()=>{})}};if(r.curves_url){let response=await fetch(r.curves_url);curves=await response.json();if(current.id!==id)return;let names=Object.keys(curves.joints);$('joint').innerHTML=names.map(n=>`<option value="${n}" ${n==='left_front_wheel_joint'?'selected':''}>${n}</option>`).join('');$('joint').onchange=draw;$('signal').onchange=draw;draw()}else $('hint').textContent='曲线生成中。'}
function draw(){if(!curves)return;let j=curves.joints[$('joint').value],signal=$('signal').value,index={speed:1,torque:3,angle:4,contact:6}[signal],second=signal==='speed'?2:signal==='angle'?5:null,rows=j.rows,canvas=$('chart'),ctx=canvas.getContext('2d'),W=canvas.width,H=canvas.height,L=60,R=20,T=15,B=30,end=rows[rows.length-1][0],vals=rows.flatMap(r=>[r[index],second==null?null:r[second]]).filter(Number.isFinite),lo=Math.min(0,...vals),hi=Math.max(0,...vals),pad=Math.max((hi-lo)*.1,.001);lo-=pad;hi+=pad;const x=t=>L+t/end*(W-L-R),y=v=>T+(hi-v)/(hi-lo)*(H-T-B);ctx.clearRect(0,0,W,H);ctx.strokeStyle='#526a7c';ctx.strokeRect(L,T,W-L-R,H-T-B);for(const [col,color] of [[index,'#78c4ff'],[second,'#c2a5ff']]){if(col==null)continue;ctx.strokeStyle=color;ctx.beginPath();let started=false;for(const row of rows){if(!Number.isFinite(row[col]))continue;started?ctx.lineTo(x(row[0]),y(row[col])):ctx.moveTo(x(row[0]),y(row[col]));started=true}ctx.stroke()}if(current.stall_trigger_s!=null){ctx.strokeStyle='#f2cc83';ctx.setLineDash([4,4]);ctx.beginPath();ctx.moveTo(x(current.stall_trigger_s),T);ctx.lineTo(x(current.stall_trigger_s),H-B);ctx.stroke();ctx.setLineDash([])}ctx.fillStyle='#afc2d0';ctx.fillText(fmt(hi,2),2,T+8);ctx.fillText(fmt(lo,2),2,H-B);ctx.fillText('0 s',L,H-8);ctx.fillText(fmt(end,1)+' s',W-65,H-8);$('hint').textContent='黄色虚线：摇臂触发时刻。';}
load();
</script></body></html>
