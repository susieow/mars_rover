<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>20 cm 关节超速诊断</title><style>
:root{color-scheme:dark;--bg:#10161d;--panel:#18222d;--line:#334456;--ink:#edf4fa;--muted:#a9bac7;--blue:#8ec9ff;--red:#ff9c91;--amber:#f1d081;--green:#91d4b0}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}a{color:var(--blue)}header,main{padding:20px 28px}header{border-bottom:1px solid var(--line)}main{max-width:1500px;margin:auto}h1{margin:8px 0;font-size:27px}p{margin:7px 0}.muted,.small{color:var(--muted)}.notice,.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px;margin:14px 0}.notice{border-left:3px solid var(--amber)}.stats{display:flex;gap:30px;flex-wrap:wrap}.stats strong{font-size:23px}.layout{display:grid;grid-template-columns:minmax(280px,1fr) minmax(0,2fr);gap:16px}.list{max-height:800px;overflow:auto}button,select{background:#233342;color:var(--ink);border:1px solid #526679;border-radius:5px;padding:7px;font:inherit;cursor:pointer}.case{width:100%;display:block;text-align:left;margin:6px 0}.case.selected{border-color:var(--blue)}.bad{color:var(--red)}.good{color:var(--green)}video{width:100%;max-height:400px;background:black}canvas{width:100%;height:260px;background:#0d151e;display:block;cursor:crosshair}label{display:inline-block;margin:5px}.flex{display:flex;flex-wrap:wrap;align-items:center;gap:8px}.event{border-top:1px solid var(--line);padding:6px 0}pre{font-size:11px;max-height:300px;overflow:auto;white-space:pre-wrap}.legend{font-size:12px}.actual{color:#64c3ff}.target{color:#c5a3ff}.limit{color:#ffd47d}.torque{color:#ff928a}@media(max-width:900px){.layout{grid-template-columns:1fr}.list{max-height:350px}header,main{padding:14px}}
</style></head><body><header><nav><a href="/speed20">← 原高轮速试验</a> · <a href="/experiments">历史试验</a></nav><h1>20 cm 关节超速诊断</h1><p class="muted">45° · 上行 15 级 · 三种物理步长 · 含 A40_C40 追加测试</p></header><main>
<div class="notice">仅供仿真诊断：超速仍标记为旧审核违规，本批没有验证完整上楼、平台、下楼和地面停稳，任何记录都不进入成功数据集。记录结束不代表车辆停稳。摇臂 1.57 rad/s 的硬件依据尚未核实。原批次 18 条，A40_C40 为追加的 3 条。</div>
<div class="stats" id="stats"></div><div class="layout"><section class="panel list"><div class="flex"><h2>全部记录</h2><button id="refresh">刷新</button></div><p id="status" class="muted"></p><div id="list"></div></section><section class="panel" id="detail"><p class="muted">选择一条记录。</p></section></div></main>
<script>
const $=id=>document.getElementById(id),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),fmt=(x,n=3)=>Number.isFinite(x)?x.toFixed(n):'—';
let cases=[],selected=null,curves=null;
function label(r){if(r.ascent_platform_support)return '六轮平台支撑，诊断结束';if(r.diagnostic_stop_reasons?.length)return '其他过程条件终止';return '到时限，未登顶'}
function violations(r){return Object.entries(r.overspeed||{}).filter(([n,o])=>o.audit.event_count>0)}
function list(){ $('list').innerHTML=cases.map(r=>`<button class="case ${r.id===selected?.id?'selected':''}" data-id="${esc(r.id)}"><b>${esc(r.id)}</b> · ${fmt(r.physics_step_s*1000,2)} ms<br><span class="${violations(r).length?'bad':'good'}">${violations(r).length?'存在速度违规':'无速度违规'}</span> · ${esc(label(r))} · ${fmt(r.actual_duration_s,2)} s ${r.video_url?'· 视频就绪':'· 视频处理中'}</button>`).join('');document.querySelectorAll('.case').forEach(b=>b.onclick=()=>show(b.dataset.id));}
async function load(){try{let p=await (await fetch('/api/overspeed20',{cache:'no-store'})).json();cases=p.cases;$('stats').innerHTML=`<div><strong>${cases.length} / ${p.planned}</strong><br><span class="small">诊断运行完成</span></div><div><strong>${cases.filter(x=>x.video_url).length}</strong><br><span class="small">视频就绪</span></div><div><strong>${cases.filter(x=>violations(x).length).length}</strong><br><span class="small">有速度违规</span></div><div><strong>未评估</strong><br><span class="small">完整路线成功率</span></div>`;$('status').textContent=`共 ${cases.length} 条，点击查看视频和曲线`;if(selected)selected=cases.find(x=>x.id===selected.id)||selected;list();if(!selected){let wanted=new URLSearchParams(location.search).get('case');if(wanted&&cases.some(x=>x.id===wanted))await show(wanted)}}catch(e){$('status').textContent='读取失败：'+e.message}}
async function show(id){selected=cases.find(x=>x.id===id);curves=null;list();let r=selected,v=violations(r),p=r.parameters,a=r.audit;let events=v.flatMap(([name,o])=>o.audit.events.map(e=>({...e,name}))).sort((a,b)=>a.first_s-b.first_s);let video=r.video_url?`<video id="video" controls preload="metadata" src="${esc(r.video_url)}"></video>`:'<p class="muted">视频正在渲染。</p>';let opts=Object.keys(a.joint_velocity_limit_rad_s).map(x=>`<option ${x==='left_rocker_joint'?'selected':''}>${esc(x)}</option>`).join('');$('detail').innerHTML=`<h2>${esc(r.id)}</h2><p>${esc(label(r))} · 物理步长 ${fmt(r.physics_step_s*1000,2)} ms · 接近／上楼 ${p.approach_rad_s}／${p.climb_rad_s} rad/s</p>${video}<p class="small">视频来自实际记录状态与原 URDF 视觉网格。结束画面不代表停稳。</p><p class="${v.length?'bad':'good'}">${v.length?'旧审核速度违规：'+esc(v.map(x=>x[0]).join('、')):'未检测到关节速度违规'}；入库：否；完整路线：未评估。</p><p>诊断终止：${esc(r.termination_reason)} ${esc((r.diagnostic_stop_reasons||[]).join(', '))}；后轮最高越过 ${r.rear_highest_100ms_geometry_level} 级。</p><h3>关节速度、力矩与姿态</h3><div class="flex"><label>关节 <select id="joint">${opts}</select></label><label>窗口 <select id="window"><option value="2">首次超速前后 2 秒</option><option value="10">首次超速前后 10 秒</option><option value="all">完整运行</option></select></label><button id="seek">跳到首次超速</button></div><p class="legend"><span class="actual">蓝：实际速度</span> · <span class="target">紫：控制器速度目标</span> · <span class="limit">黄虚线：±URDF 上限</span> · <span style="color:#ffac50">橙点线：±审核阈值</span> · <span class="torque">红：执行器力矩（右轴）</span>。横轴为仿真秒；目标与力矩属于前一积分步。</p><canvas id="chart" width="1000" height="260"></canvas><p id="hover" class="small">移动鼠标查看时间、速度、力矩、姿态及轮地接触力。</p><div id="events"></div><details><summary>原始审核和运行参数</summary><pre>${esc(JSON.stringify({parameters:r.parameters,diagnostic_stop_reasons:r.diagnostic_stop_reasons,audit:r.audit,route:r.route},null,2))}</pre></details>`;
$('joint').onchange=draw;$('window').onchange=draw;$('seek').onclick=()=>{let e=selectedEvent();let video=$('video');if(e&&video){video.currentTime=Math.max(0,e.first_s-.3);video.play()}};
if(r.curves_url){try{curves=await (await fetch(r.curves_url)).json();if(selected.id===id)draw()}catch(e){$('hover').textContent='曲线读取失败：'+e.message}}else $('hover').textContent='曲线正在生成。';}
function selectedEvent(){return selected.overspeed?.[$('joint').value]?.audit?.events?.[0]||null}
function draw(){if(!curves)return;let name=$('joint').value,j=curves.joints[name],ev=selected.overspeed?.[name]?.audit?.events||[],first=ev[0],window=$('window').value,center=first?.first_s??selected.first_contact_time_s??0,start=window==='all'?0:Math.max(0,center-Number(window)/2),end=window==='all'?selected.actual_duration_s:Math.min(selected.actual_duration_s,center+Number(window)/2);let data=j.rows.filter(x=>x[0]>=start&&x[0]<=end);let canvas=$('chart'),ctx=canvas.getContext('2d'),W=canvas.width,H=canvas.height,L=50,R=55,T=12,B=26;ctx.clearRect(0,0,W,H);ctx.fillStyle='#0d151e';ctx.fillRect(0,0,W,H);if(!data.length){$('hover').textContent='此窗口没有采样数据';return}let vmax=Math.max(j.audit_threshold,...data.map(x=>Math.max(Math.abs(x[1]),Math.abs(x[2]))))*1.1||1;let tmax=Math.max(1,...data.map(x=>Math.abs(x[3])))*1.1;let xx=t=>L+(t-start)/(end-start||1)*(W-L-R),yv=v=>T+(vmax-v)/(2*vmax)*(H-T-B),yt=v=>T+(tmax-v)/(2*tmax)*(H-T-B);ctx.strokeStyle='#334456';ctx.strokeRect(L,T,W-L-R,H-T-B);ctx.fillStyle='#afc0ce';ctx.font='12px sans-serif';ctx.fillText(fmt(vmax,1)+' rad/s',2,T+9);ctx.fillText('-'+fmt(vmax,1),2,H-B);ctx.fillText(fmt(tmax,0)+' Nm',W-R+3,T+9);ctx.fillText(fmt(start,2)+' s',L,H-6);ctx.fillText(fmt(end,2)+' s',W-R-38,H-6);function line(index,color,ys){ctx.strokeStyle=color;ctx.lineWidth=1.5;ctx.beginPath();data.forEach((r,i)=>{let X=xx(r[0]),Y=ys(r[index]);i?ctx.lineTo(X,Y):ctx.moveTo(X,Y)});ctx.stroke()}for(let [level,color,dash] of [[j.limit,'#ffd47d',[6,4]],[j.audit_threshold,'#ffac50',[2,3]]]){for(let l of [-level,level]){ctx.strokeStyle=color;ctx.setLineDash(dash);ctx.beginPath();ctx.moveTo(L,yv(l));ctx.lineTo(W-R,yv(l));ctx.stroke()}}ctx.setLineDash([]);line(3,'#ff928a',yt);line(2,'#c5a3ff',yv);line(1,'#64c3ff',yv);$('events').innerHTML=ev.length?'<h4>超过原审核阈值 '+fmt(j.audit_threshold)+' rad/s 的事件</h4>'+ev.map(e=>`<div class="event">首次 ${fmt(e.first_s)} s · 峰值 ${fmt(e.peak_signed_rad_s)} rad/s · ${fmt(e.duration_s*1000,2)} ms · ${e.censored?'终止时尚未观察到恢复':'恢复 '+fmt(e.recovered_s)+' s'}</div>`).join(''):'<p class="muted">此关节未超过原审核阈值。</p>';canvas.onmousemove=e=>{let t=start+(e.offsetX/canvas.clientWidth*W-L)/(W-L-R)*(end-start);let closest=data.reduce((a,b)=>Math.abs(b[0]-t)<Math.abs(a[0]-t)?b:a);$('hover').textContent=`${fmt(closest[0])} s · 实际 ${fmt(closest[1])} rad/s · 目标 ${fmt(closest[2])} rad/s · 力矩 ${fmt(closest[3],1)} N·m · 横滚 ${fmt(closest[4],1)}° · 俯仰 ${fmt(closest[5],1)}° · 轮地接触力合计 ${fmt(closest[6],1)} N`}}
$('refresh').onclick=load;load();
</script></body></html>
