<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>20 cm 高轮速试验 · 火星车</title>
<style>
:root{color-scheme:dark;--bg:#0c1117;--panel:#151d26;--line:#2b3b4c;--ink:#e8eff5;--muted:#a5b5c3;--blue:#9bcaff;--amber:#eec879;--red:#ff9c95;--green:#9cd3b1}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.65 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}a{color:var(--blue)}header{padding:24px;border-bottom:1px solid var(--line)}h1{font-size:27px;margin:10px 0 4px}h2{font-size:18px}p{margin:8px 0}.muted{color:var(--muted)}main{max-width:1500px;margin:auto;padding:24px}.notice{background:#192530;border-left:3px solid var(--blue);padding:14px;margin:16px 0}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat,.card{background:var(--panel);border:1px solid var(--line);border-radius:10px}.stat{padding:16px}.stat strong{font-size:24px;display:block}.stat span,.small{font-size:12px;color:var(--muted)}.filters{display:flex;gap:12px;align-items:center;margin:22px 0;flex-wrap:wrap}select,input,button{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.card{overflow:hidden}video{width:100%;display:block;background:#000;aspect-ratio:8/3}.body{padding:15px}.card h2{font-size:16px;margin:4px 0}.id{font:12px monospace;color:var(--muted);overflow-wrap:anywhere}.badge{font-size:12px;color:var(--amber)}.bad{color:var(--red)}.good{color:var(--green)}dl{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin:12px 0}dt{color:var(--muted)}dd{text-align:right;margin:0;overflow-wrap:anywhere}details{border-top:1px solid var(--line);padding-top:10px}summary{cursor:pointer;color:var(--blue)}pre{white-space:pre-wrap;overflow-wrap:anywhere;max-height:420px;overflow:auto;font-size:11px}.empty{padding:24px;color:var(--muted)}@media(max-width:1000px){.cards{grid-template-columns:repeat(2,1fr)}.stats{grid-template-columns:repeat(2,1fr)}}@media(max-width:650px){main,header{padding:16px}.cards{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<header><nav><a href="/experiments">← 返回历史高台阶试验</a> · <a href="/">成功轨迹</a></nav><h1>20 cm 高轮速试验</h1><p class="muted">45° · 上 15 级 → 平台 → 下 15 级 → 地面停稳</p></header>
<main>
<p class="notice">视频从地面起点开始，使用原 URDF 视觉网格与已记录状态渲染。上楼诊断的结束画面不代表车辆停稳；只有完整路线、原审核、重放、步长复核和视频审核全部通过，才可作为成功数据。</p>
<section class="stats" id="stats"></section>
<p id="limits" class="notice"></p>
<div class="filters"><label>阶段 <select id="stage"><option value="all">全部记录</option><option value="flat_calibration">平地校验</option><option value="speed_matrix">轮速对照</option><option value="wheel_distribution">轮组分配</option><option value="full_route">完整路线</option></select></label><label>搜索 <input id="search" placeholder="编号或违规原因"></label><button id="refresh">刷新</button><span id="status" class="small"></span></div>
<section id="cases" class="cards"></section>
</main>
<script>
const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=(v,n=2)=>Number.isFinite(v)?Number(v).toFixed(n):'—';
const labels={flat_calibration:'平地加速与制动校验',speed_matrix:'上楼轮速对照',wheel_distribution:'前中后轮分配',full_route:'完整路线'};
const reasons={joint_velocity_limit:'关节实际转速超出 URDF 上限',contact_penetration_over_20mm:'接触穿透超过 20 mm',non_wheel_contact_over_20ms:'非轮接触超过 20 ms',route_roll_over_15deg:'侧倾超过 15°',route_pitch_over_60deg:'俯仰超过 60°',mujoco_warning:'MuJoCo 数值警告'};
const reasonText=x=>{const prefix=String(x).split(':')[0];return (reasons[prefix]||'过程审核拒绝')+'：'+x};
let data=null;
function state(r){if(r.kind==='flat_calibration')return r.attained&&r.braking_completed&&r.process_valid?'校验通过':'校验未通过';if(r.full_route_success)return'完整路线通过，待独立验证';if(!r.process_valid)return'过程违规，已终止';if(r.ascent_platform_support)return'六轮平台支撑，上楼诊断';return r.kind==='full_route'?'完整路线未完成':'未登顶，上楼诊断';}
function card(r){const p=r.parameters||{},a=r.audit||{},v=r.virtual_crossing||{},kind=r.kind;const errors=r.process_reasons||[];const video=r.video_url?`<video controls preload="metadata" playsinline src="${esc(r.video_url)}"></video>`:'<div class="empty">视频尚未就绪，记录已保存</div>';const targets=kind==='flat_calibration'?`${fmt(r.target_rad_s,0)} rad/s`:`${fmt(p.approach_rad_s,0)} / ${fmt(p.climb_rad_s,0)} rad/s`;const detected=kind==='flat_calibration'?fmt(v.body_speed_m_s,3)+' m/s':r.first_contact_time_s==null?'未锁存':fmt(r.first_contact_time_s,3)+' s';const contact=kind==='flat_calibration'?'虚拟首阶处车速':'首次前轮接触锁存';const detail={parameters:p,termination_reason:r.termination_reason,process_reasons:errors,first_failure_s:r.first_failure_s,first_contact_time_s:r.first_contact_time_s,first_contact_wheel_speeds_rad_s:r.first_contact_wheel_speeds_rad_s,climb_phase_s:r.climb_phase_s,same_actual_control_as:r.same_actual_control_as,virtual_crossing:r.virtual_crossing,brake_to_1_rad_s_distance_m:r.brake_to_1_rad_s_distance_m,wheel_names:r.wheel_names,max_wheel_center_z_m:r.max_wheel_center_z_m,rear_crossing_peak_s_by_level:r.rear_crossing_peak_s_by_level,rear_crossing_supported_total_s_by_level:r.rear_crossing_supported_total_s_by_level,brake_trigger:r.brake_trigger,audit:r.audit,route:r.route,video_info:r.video_info,dataset_accepted:r.dataset_accepted};return `<article class="card">${video}<div class="body"><div class="id">${esc(r.id)}</div><h2>${esc(labels[kind]||kind)}</h2><div class="badge ${r.process_valid?'good':'bad'}">${esc(state(r))}</div><dl><dt>接近 / 上楼目标</dt><dd>${esc(targets)}</dd><dt>时长</dt><dd>${fmt(r.actual_duration_s)} s</dd><dt>${contact}</dt><dd>${esc(detected)}</dd>${kind==='speed_matrix'?`<dt>上楼阶段执行</dt><dd>${fmt(r.climb_phase_s,3)} s</dd>`:''}<dt>后轮越过最高级</dt><dd>${kind==='flat_calibration'?'不适用':esc(r.rear_highest_100ms_geometry_level??'—')}</dd><dt>最大接触穿透</dt><dd>${fmt(a.max_contact_penetration_m*1000)} mm</dd><dt>完整路线</dt><dd>${kind==='full_route'?(r.full_route_success?'通过，待验证':'未完成'):'未评估'}</dd></dl>${errors.length?`<p class="bad small">${errors.map(x=>esc(reasonText(x))).join('<br>')}<br>首次违规 t=${fmt(r.first_failure_s,3)} s</p>`:''}${r.same_actual_control_as?.length?`<p class="small">实际控制序列与 ${esc(r.same_actual_control_as.join('、'))} 相同。</p>`:''}<p class="small">${r.video_info?'来源：实际逐步记录，原 URDF 视觉网格。':esc(r.media_status||'视频处理中')} · 不在成功数据集</p><details><summary>参数、速度与完整审核</summary><pre>${esc(JSON.stringify(detail,null,2))}</pre></details></div></article>`;}
function draw(){if(!data)return;let rows=data.cases.filter(r=>($('stage').value==='all'||r.kind===$('stage').value)&&[r.id,...(r.process_reasons||[])].join(' ').toLowerCase().includes($('search').value.toLowerCase()));$('cases').innerHTML=rows.length?rows.map(card).join(''):'<p class="empty">当前没有符合条件的记录。</p>';$('status').textContent=`显示 ${rows.length} / ${data.cases.length} 条，视频 ${rows.filter(r=>r.video_url).length} 条`}
async function load(){try{let r=await fetch('/api/speed20',{cache:'no-store'});if(!r.ok)throw Error(`HTTP ${r.status}`);data=await r.json();let s=data.summary;const box=(name,value,hint)=>`<div class="stat"><span>${name}</span><strong>${value}</strong><span>${hint}</span></div>`;$('stats').innerHTML=box('平地校验',`${s.flat_calibration.attained} / ${s.flat_calibration.executed}`,'实际达到目标并完成制动')+box('上楼轮速对照',`${s.speed_matrix.ascent_platform_support} / ${s.speed_matrix.executed}`,'六轮平台支撑 / 实际测试')+box('轮组分配',`${s.wheel_distribution.ascent_platform_support} / ${s.wheel_distribution.executed}`,'六轮平台支撑 / 实际测试')+box('完整路线',s.full_route.executed?`${s.full_route.full_route_success} / ${s.full_route.executed}`:'未执行','仅完整路线可进入成功验证');let a=data.analysis;$('limits').textContent=`36 组上楼参数对应 ${a.unique_main_actual_control_sequences} 条不同的实际控制序列：其中 ${a.main_climb_phase_never_started} 组未进入上楼阶段；含这部分在内，共 ${a.main_climb_phase_10ms_or_less} 组上楼阶段不超过 10 ms。不能据此判断所有上楼目标的长期效果。`;draw()}catch(e){$('status').textContent='读取失败：'+e.message}}
$('stage').addEventListener('change',draw);$('search').addEventListener('input',draw);$('refresh').addEventListener('click',load);load();
</script>
</body>
</html>
